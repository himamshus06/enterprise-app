<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">🏦 Enterprise Bank Dashboard</span>
        <button class="btn btn-outline-light" onclick="logout()">Logout</button>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 mb-4">
                    <h5>My Balance</h5>
                    <h2 id="balance">$0.00</h2>
                    <button class="btn btn-primary" onclick="refreshBalance()">Refresh</button>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card p-4">
                    <h5>Transfer Funds</h5>
                    <div class="mb-3">
                        <label>From Account Number</label>
                        <input type="text" id="fromAcc" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>To Account Number</label>
                        <input type="text" id="toAcc" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Amount</label>
                        <input type="number" id="amount" class="form-control">
                    </div>
                    <button class="btn btn-success" onclick="doTransfer()">Send Money</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwt');
        if (!token) window.location.href = '/index.html';

        async function refreshBalance() {
            const accNum = prompt("Enter your account number:");
            if(!accNum) return;
            const res = await fetch(`/api/accounts/balance/${accNum}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(res.ok) {
                const balance = await res.text();
                document.getElementById('balance').innerText = '$' + balance;
            } else {
                alert('Error fetching balance');
            }
        }

        async function doTransfer() {
            const from = document.getElementById('fromAcc').value;
            const to = document.getElementById('toAcc').value;
            const amount = document.getElementById('amount').value;

            const res = await fetch('/api/accounts/transfer', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `from=${from}&to=${to}&amount=${amount}`
            });

            if(res.ok) alert('Transfer successful!');
            else {
                const err = await res.json();
                alert('Error: ' + err.message);
            }
        }

        function logout() {
            localStorage.removeItem('jwt');
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
